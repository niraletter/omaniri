# Make user apps the only thing systemd-oomd is allowed to kill.
#
# Niri runs as the niri.service user service outside app.slice, so marking only
# app.slice as a kill candidate keeps the compositor structurally ineligible.
# Without uwsm there is no per-app scoping anymore, though: apps launched by the
# shell are plain children of the Quickshell process rather than individually
# scoped app.slice/app-*.scope units, so oomd currently has little to act on
# here. The drop-in stays because app.slice configuration is harmless and still
# governs anything that does land in app.slice; restoring per-app pressure kills
# means wrapping launches in `systemd-run --user --scope`.
#
# Swap kill is a backstop for the slower shape of the same problem, where swap
# fills before pressure spikes. It uses the global SwapUsedLimit (90%) from
# /etc/systemd/oomd.conf.d/10-omaniri.conf, which also carries the pressure
# thresholds.
[Slice]
ManagedOOMMemoryPressure=kill
ManagedOOMSwap=kill
